name: Pages

# Veroeffentlicht den Web-Export aus docs/ als GitHub-Pages-Seite.
#
# Voraussetzung, einmalig von Hand: Settings -> Pages -> Source auf
# "GitHub Actions" stellen. Das erstmalige Anlegen einer Pages-Seite
# erlaubt GitHub nur Menschen, nicht dem Token eines Workflows
# ("Resource not accessible by integration"). Danach laeuft alles hier.

on:
  push:
    branches: [main, claude/godot-rennspiel-start-nywmuk]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
